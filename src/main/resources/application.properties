# Configuração H2 (Banco em memória para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:news_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Visualizar no console a query SQL gerada
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto SQL para H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Hibernate ddl auto (para criar tabelas)
spring.jpa.hibernate.ddl-auto=update

